# Phase 332: Board-dynamic trailing-MFE structural EXIT (production).
# Baseline settings match Phase153b entry_price_risk_guard_shadow; entry/universe unchanged.

profile: momentum_volume_v13_combined
entry_profile: momentum_volume_v2

# Phase267: quality entry reject off; entry_score_v2>=4 gate.
min_continuation_quality: 0.70
max_concurrent_positions: 5
position_cap_mode: true
position_cap_release: structural_exit
# Phase414: reject same-symbol ENTRY while position open (no overlap_replaced_review chain)
same_symbol_open_policy: no_overlap_replace
virtual_hold_sec: 300
entry_cooldown_sec: 300
reject_below_quality: false
entry_score_v2_min: 3

allowed_trading_windows:
  - start: "09:05"
    end: "11:23"
  - start: "12:33"
    end: "15:20"

baseline_policy: q070_cap3_entry_price_risk_guard_shadow_trial
policy_label: q070_cap3_entry_price_risk_guard_trailing_mfe_shadow_trial
policy_trial: true
shadow_only: true

# Structural EXIT policy (board-dynamic trailing_mfe — Phase332 production)
structural_exit_policy: combined_structural_exit_v1_trailing_mfe_shadow

entry_price_risk_guard_enabled: true
entry_price_risk_guard_shadow: true
entry_price_risk_guard_min_entry_price: 50
entry_price_risk_guard_max_tick_ratio_pct: 5.0
entry_price_risk_guard_apply_mode: reject_entry

# Phase355: legacy VWAP pullback — disabled Phase439 (replaced by High Drift)
legacy_vwap_pullback_guard_enabled: false
enable_pullback_misread_dynamic40_guard: false

# Phase439: High Drift pullback guard (production ENTRY reject)
high_drift_guard_enabled: true

# Phase442: No Progress Exit (production structural EXIT)
no_progress_exit_enabled: true

# Phase452: Weak Shape Reject (opening_peak / slow_opening_peak at ENTRY)
weak_shape_reject_enabled: true

# Phase472: PBv2 — explicit momentum score cutoff + Late Chase Guard
momentum_score_cutoff_max: 0.2546
late_chase_guard_enabled: true

# Phase503: Classic late_chase AND RSI14>=80 ENTRY reject (Phase502 guard C)
classic_late_chase_rsi_guard_enabled: true
classic_late_chase_rsi_threshold: 80

# Phase525: Re-entry after stop_hit requires RSI14>60 (Phase524 E_rsi_gt_60)
reentry_rsi_guard_enabled: true
reentry_rsi_guard_threshold: 60.0

# Phase528: Entry quality guard G9 — spread<=50bps AND update_count<=5 (Phase527)
entry_quality_guard_enabled: true
entry_quality_max_spread_bps: 50.0
entry_quality_max_update_count: 5

# Phase549: PBv2 cluster guard V6 Balanced Reject + E4 Liquidity Burst exception
entry_cluster_guard_enabled: true
entry_cluster_guard_exception_enabled: true
entry_cluster_guard_liquidity_burst_threshold: 0.052267
entry_cluster_guard_model_path: kabu_native/configs/entry_cluster_guard_model.json
entry_cluster_guard_reject_clusters: [5]
entry_cluster_guard_reject_csubs: []

# Phase557: PBv2 stop_low_mfe guard — Phase606 rollback to pre-6/25 PBv2 path
stop_low_mfe_guard_enabled: false
stop_low_mfe_guard_threshold: 0.009
stop_low_mfe_guard_missing_policy: pass
stop_low_mfe_guard_pbv2_only: true

# Phase563: EXIT shadow monitor (T3 board_high loosen primary, T2 faster trailing watch).
# Phase669: T2/T3 removed from portfolio. Rollback: re-enable flags below.
exit_shadow_monitor_enabled: false
exit_shadow_monitor_t2_enabled: false
exit_shadow_monitor_t3_enabled: false

# Phase364: production ENTRY guard — Dynamic40 near day high + low momentum
enable_near_day_high_low_momentum_dynamic40_guard: true

favorable_mode: mfe_linked
favorable_mfe_scale: 0.003
use_market_time_window: true

daytrade_suitability_enabled: true
daytrade_suitability_rule: volatility_liquidity_top50
daytrade_suitability_lookback_sessions: prior_only
daytrade_suitability_apply_mode: reject_entry

# Phase590: V90/V80 volume gate shadow (production remains V100)
volume_gate_relaxation_shadow_enabled: false

# Phase591: live order dry-run adapter (no real orders; trading_enabled=false)
live_order_dry_run_enabled: true
live_order_api_wiring_enabled: true
live_capital_check_enabled: true
live_order_adapter_enabled: true
live_order_notifier_enabled: true
live_order_discord_enabled: false
live_order_jsonl_enabled: true
live_order_safety_sm_enabled: true
dry_run: true
live_trading_enabled: false
live_order_entry_timeout_sec: 4.0

# Phase575: vol/liq startup cache (rollback: vol_liq_startup_cache_enabled=false)
vol_liq_startup_cache_enabled: true
vol_liq_startup_cache_dir: kabu_native/results/cache/vol_liq_startup
vol_liq_startup_cache_fallback_on_error: true
vol_liq_startup_cache_write_after_fallback: true

comparison_note: >
  Phase472 PBv2 production: explicit momentum_continuation_score<=0.2546 (replaces
  Momentum:low token; Phase471 equivalent) + Board:mid/high + High Drift + Weak Shape
  + Late Chase Guard (r10<0.3719 AND day_high_distance<1.1872). Rollback:
  late_chase_guard_enabled=false. Phase503: Classic late_chase_cluster AND RSI14>=80
  ENTRY reject (Phase502 guard C). Rollback: classic_late_chase_rsi_guard_enabled=false.
  Phase525: Re-entry after stop_hit requires RSI14>60 (Phase524 E_rsi_gt_60).
  Rollback: reentry_rsi_guard_enabled=false.
  Phase528: Entry quality guard G9 spread<=50bps AND update_count<=5 (Phase527).
  Rollback: entry_quality_guard_enabled=false.
  Phase549: PBv2 cluster guard V6 (reject cluster5 + csub 0/2/3/5) + E4 liquidity_burst>=0.052267
  exception. OR overlay unchanged. Rollback: entry_cluster_guard_enabled=false;
  exception-only rollback: entry_cluster_guard_exception_enabled=false.
  Phase606 PBv2 restore: stop_low_mfe_guard_enabled=false; entry_cluster_guard_reject_csubs=[] (csub rollback).
  Phase549 cluster5 reject retained. Preflight: production_config_sha256.pin must match disk YAML.
  Phase538: OR Open Strength Overlay on mainline ENTRY (O_R003_OR + OS9, CAP_SPLIT_4_1:
  PBv2=4 OR=1 total=5). Rollback: or_overlay_enabled=false.
  Phase452 production: Weak Shape Reject blocks
  opening_peak/slow_opening_peak at ENTRY (forward-safe, no EOD close). Rollback:
  weak_shape_reject_enabled=false. Phase442 production: No Progress Exit
  (linmfe_t900_i0p6_s0p05_c0p8_p0p3) on structural EXIT — hold>=900s, required MFE
  0.6+0.05/5m cap 0.8, pnl<0.3%. Rollback: no_progress_exit_enabled=false.
  Phase439: High Drift pullback guard replaces VWAP pullback (Phase355). dynamic40
  AND ((day_high>=1.2% AND r10<-0.15% AND r5>r10) OR (day_high>=1.5% AND (r15<-0.5%
  OR r5<-0.5%))). Rollback: high_drift_guard_enabled=false;
  legacy_vwap_pullback_guard_enabled=true. Phase332 board-dynamic trailing_mfe via
  structural_exit_policy=combined_structural_exit_v1_trailing_mfe_shadow. Stop/session_close/
  overlap preserved; no momentum_fade/quality_decay exits. board_high
  (entry_imbalance_percentile>=47.62): activate 1.0%, giveback 60%. board_low (<47.62):
  activate 0.6%, giveback 40%. Shadow logs compare legacy fixed (0.8%/50%) counterfactual.

