# 市場セッション制御（ENTRY 時間枠）
# 目的: 板安定化・引け前新規建て回避（特定時刻のバックテスト最適化ではない）

market_session_control: true

entry_start_jst: "09:05"
entry_end_jst: "14:50"

# 14:50 以降: 新規 ENTRY 禁止。保有ポジションは kabu_exit_v1 または EOD close。

notes:
  - "09:05 開始: 寄り付き直後の乱高下・板薄時間を避ける"
  - "14:50 終了: 引け競り・板収束前の新規リスクを避ける"
  - "no_entry_until による 09:30 等の最適化ゲートは廃止"
